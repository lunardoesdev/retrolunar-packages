# meson cross file for i686-w64-mingw32 (Windows XP).
#
# No cross tools are listed here: meson takes the compiler from the
# environment ($CC, $CXX, $AR), which the system exports. Only host programs
# such as pkg-config are named.

[binaries]
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[built-in options]
# XP is NT 5.1. The preprocessor value gates the headers; 5.1 in the PE
# subsystem field is what makes the binary loadable on XP.
c_args = ['--target=i686-w64-windows-gnu', '-D_WIN32_WINNT=0x501', '-DWINVER=0x501']
c_link_args = ['-fuse-ld=lld', '-Wl,-subsystem,windows:5.1']
